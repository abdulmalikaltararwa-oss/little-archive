services:
  archive:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      LA_ADMIN_PASSWORD: ${LA_ADMIN_PASSWORD:?Run python3 scripts/setup.py first}
      LA_PUBLIC_URL: ${LA_PUBLIC_URL:-http://localhost:8787}
      LA_DATA_DIR: /data
      LA_OLLAMA_URL: ${LA_OLLAMA_URL:-}
      LA_OLLAMA_MODEL: ${LA_OLLAMA_MODEL:-}
      # Optional understanding layer; every value is empty (off) unless you set it. See docs/understanding.md.
      LA_AI_PROVIDER: ${LA_AI_PROVIDER:-}
      LA_GEMINI_API_KEY: ${LA_GEMINI_API_KEY:-}
      LA_GEMINI_MODEL: ${LA_GEMINI_MODEL:-}
      LA_AI_BATCH_SIZE: ${LA_AI_BATCH_SIZE:-}
      LA_AI_SHARE_PRIVATE_CONTEXT: ${LA_AI_SHARE_PRIVATE_CONTEXT:-}
      LA_FETCH_ENABLED: ${LA_FETCH_ENABLED:-}
      LA_FETCH_TIMEOUT_SECONDS: ${LA_FETCH_TIMEOUT_SECONDS:-}
      LA_FETCH_MAX_BYTES: ${LA_FETCH_MAX_BYTES:-}
      LA_FETCH_MAX_REDIRECTS: ${LA_FETCH_MAX_REDIRECTS:-}
      LA_FETCH_CONTACT: ${LA_FETCH_CONTACT:-}
      LA_TRANSCRIBE_PROVIDER: ${LA_TRANSCRIBE_PROVIDER:-}
      LA_GEMINI_TRANSCRIBE_MODEL: ${LA_GEMINI_TRANSCRIBE_MODEL:-}
      LA_GROQ_API_KEY: ${LA_GROQ_API_KEY:-}
      LA_GROQ_MODEL: ${LA_GROQ_MODEL:-}
      LA_TRANSCRIBE_AUTO: ${LA_TRANSCRIBE_AUTO:-}
      LA_TRANSCRIBE_MAX_MB: ${LA_TRANSCRIBE_MAX_MB:-}
      LA_TRANSCRIBE_MAX_MINUTES: ${LA_TRANSCRIBE_MAX_MINUTES:-}
      LA_PUBLIC_CACHE: ${LA_PUBLIC_CACHE:-}
      LA_PUBLIC_CACHE_TTL_DAYS: ${LA_PUBLIC_CACHE_TTL_DAYS:-}
    volumes:
      - archive-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
volumes:
  archive-data:
