apply plugin: 'com.android.application'

// Release signing. The upload keystore and its passwords are never in the repository. A release build reads these four
// values from Gradle properties (your own ~/.gradle/gradle.properties, or -P on the command line) or, failing that, from
// environment variables of the same names. With none of them set every build still works: debug builds use the debug key,
// and a release build comes out unsigned. With only some of them set the build stops, so a half-configured release is
// never mistaken for a signed one.
def signingNames = ['LA_ANDROID_KEYSTORE', 'LA_ANDROID_KEYSTORE_PASSWORD', 'LA_ANDROID_KEY_ALIAS', 'LA_ANDROID_KEY_PASSWORD']
def signingValues = signingNames.collectEntries { name -> [name, providers.gradleProperty(name).orElse(providers.environmentVariable(name)).getOrNull()] }
def signingMissing = signingNames.findAll { !signingValues[it] }
def hasReleaseSigning = signingMissing.isEmpty()
if (!hasReleaseSigning && signingMissing.size() < signingNames.size()) {
    throw new GradleException("Release signing is half set: ${signingMissing.join(', ')} missing. Set all four or none (docs/mobile-app.md, \"A release build for Google Play\").")
}

android {
    namespace = "app.littlearchive.mobile"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "app.littlearchive.mobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                // An absolute path, or one relative to this folder. Keep the file outside the repository.
                storeFile file(signingValues.LA_ANDROID_KEYSTORE)
                storePassword signingValues.LA_ANDROID_KEYSTORE_PASSWORD
                keyAlias signingValues.LA_ANDROID_KEY_ALIAS
                keyPassword signingValues.LA_ANDROID_KEY_PASSWORD
            }
        }
    }
    buildTypes {
        release {
            if (hasReleaseSigning) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // The one-time unlock (StorePurchasesPlugin). Google's own library, nothing else: no purchase service, no ads.
    implementation "com.android.billingclient:billing:$billingVersion"
    // Custom Tabs (SocialSignInPlugin). AndroidX's own library, nothing else: no Google sign-in SDK.
    implementation "androidx.browser:browser:$androidxBrowserVersion"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
