<!doctype html>
<html lang="en" dir="ltr" data-demo="true">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f8f3ea">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="Explore Little Archive with a synthetic interactive demo. No account, real imports, or backend connection. Changes reset on reload.">
    <!-- No connection of any kind leaves this page. Styles set from script (element.style) are not inline styles, but the
         dialog library adds one small <style> element for scroll locking, so 'unsafe-inline' is allowed for styles only. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; connect-src 'none'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
    <title>Little Archive — Interactive demo</title>
    <link rel="icon" href="./icon.svg" type="image/svg+xml">
    <script src="./theme-init.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </head>
  <body>
    <div id="app">
      <main id="main" style="min-height:100dvh;display:grid;place-items:center;text-align:center;font-family:system-ui,sans-serif">
        <div>
          <img src="./icon.svg" alt="" width="56" height="56">
          <h1 style="font-size:1.6rem;margin:.8rem 0 .3rem">Little Archive</h1>
          <p>Opening the synthetic interactive demo…</p>
        </div>
      </main>
    </div>
    <noscript><p style="padding:30px">Enable JavaScript to explore this synthetic demo. No server connection or account is used.</p></noscript>
  </body>
</html>
