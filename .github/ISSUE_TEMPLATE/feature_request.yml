name: Feature request
description: Describe an improvement and the problem it would solve.
body:
  - type: markdown
    attributes:
      value: "Use synthetic examples. Do not attach private exports, saved libraries, credentials, or personal account screenshots."
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the task and where the current app makes it difficult.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe a concrete result and any alternatives you considered. Use invented records to illustrate it.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Public report check
      options:
        - label: This request contains no private exports, credentials, or personal account data.
          required: true
