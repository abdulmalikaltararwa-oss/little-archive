name: Publish synthetic demo

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ui/**'
      - 'web/**'
      - 'LICENSE'
      - 'scripts/build_demo.py'
      - '.github/workflows/demo-pages.yml'

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Check the shared modules and synthetic data
        run: node --test web/*.test.mjs
      - name: Install the interface's dependencies
        run: npm ci --ignore-scripts
        working-directory: ui
      - name: Check the interface
        run: npm test
        working-directory: ui
      - name: Build the interface
        run: npm run build
        working-directory: ui
      - name: Read Pages configuration
        uses: actions/configure-pages@v5
        with:
          enablement: false
      - name: Build isolated synthetic demo
        run: python scripts/build_demo.py
      - name: Verify the public artifact allowlist
        shell: bash
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          # Checked here, apart from the build script that made the folder: this is the rule for what goes public.
          root = Path('dist-demo')
          # The plain pages the apps link to, their stylesheet and its one font: fixed names, nothing else.
          pages = {'privacy.html', 'terms.html', 'support.html', 'delete-account.html'}
          # They are published only once the owner has set the contact address they name, in web/site.json.
          # Unset: none of them, nor their stylesheet or font, may be in the artifact. Set: all of them, with it.
          contact = json.loads(Path('web/site.json').read_text(encoding='utf-8'))['contact_email'].strip()
          if contact and not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9._+-]*@(?:[A-Za-z0-9-]+\.)+[A-Za-z]{2,24}', contact):
              raise SystemExit('contact_email in web/site.json is not an email address.')
          site = pages | {'pages.css', 'fonts/fraunces-soft.woff2'} if contact else set()
          folders = {'assets', 'fonts'} if contact else {'assets'}
          fixed = {'index.html', 'theme-init.js', 'icon.svg', 'LICENSE', '.nojekyll', '.little-archive-demo-build'} | site
          hashed = re.compile(r'assets/[A-Za-z0-9._-]+-[A-Za-z0-9_-]{8}\.(js|css|woff2?|webp)')
          paths = list(root.rglob('*'))
          if any(path.is_symlink() for path in paths):
              raise SystemExit('The demo artifact must not contain symbolic links.')
          dirs = {str(path.relative_to(root)) for path in paths if path.is_dir()}
          files = [path for path in paths if not path.is_dir()]
          names = {str(path.relative_to(root)) for path in files}
          if dirs != folders:
              raise SystemExit(f'Unexpected demo artifact folders: {sorted(dirs ^ folders)}')
          unexpected = sorted(name for name in names if name not in fixed and not hashed.fullmatch(name))
          if unexpected:
              raise SystemExit(f'Unexpected demo artifact files: {unexpected}')
          if not fixed <= names:
              raise SystemExit(f'Missing demo artifact files: {sorted(fixed - names)}')
          if any(not path.is_file() for path in files):
              raise SystemExit('The demo artifact must contain only regular files.')
          media = [name for name in names if name.endswith('.webp')]
          if len(media) != 60:
              raise SystemExit(f'Expected the 60 synthetic demo images, found {len(media)}.')
          # The demo has no backend and does not advertise the installable app.
          installable = re.compile(r'(?:^|/)(?:manifest[.-]|apple-touch|icons/|share[.-])', re.I)
          if any(installable.search(name) for name in names):
              raise SystemExit('The demo artifact must not ship installable-app files.')
          page = (root / 'index.html').read_text(encoding='utf-8')
          if "connect-src 'none'" not in page or re.search(r'rel="(?:manifest|apple-touch-icon)"', page):
              raise SystemExit('The demo page must forbid every connection and must not link the installable app.')
          # The plain pages run no script and load only the stylesheet and the icon beside them.
          for name in sorted(pages & site):
              text = (root / name).read_text(encoding='utf-8')
              if '{{' in text or '}}' in text or '[owner to set]' in text or text.count(contact) != 1:
                  raise SystemExit(f'{name} must name the contact address once, with nothing left to fill in.')
              if "default-src 'none'" not in text or re.search(r'<script\b|<iframe\b|<form\b', text, re.I):
                  raise SystemExit(f'{name} must be a plain page: no script, frame or form, and nothing loaded by default.')
              loaded = set(re.findall(r'<(?:link|img)\b[^>]*\s(?:href|src)="([^"]*)"', text))
              if loaded != {'./icon.svg', './pages.css'}:
                  raise SystemExit(f'{name} loads {sorted(loaded)}; only ./icon.svg and ./pages.css are published for it.')
              for link in re.findall(r'<a\b[^>]*\shref="([^"]*)"', text):
                  target = link.split('#')[0]
                  if link.startswith('https://') or target in {'', './'}:
                      continue
                  if not target.startswith('./') or target[2:] not in pages:
                      raise SystemExit(f'{name} links to {link}, which is not published.')
          styles = (root / 'pages.css').read_text(encoding='utf-8') if site else "url('./fonts/fraunces-soft.woff2')"
          if '@import' in styles or re.findall(r'url\(([^)]*)\)', styles) != ["'./fonts/fraunces-soft.woff2'"]:
              raise SystemExit('pages.css must load only its own font file.')
          # No credential-shaped text in anything published.
          for path in files:
              if path.suffix in {'.js', '.css', '.html', '.svg'}:
                  text = path.read_text(encoding='utf-8', errors='ignore')
                  for needle in ('LA_ADMIN_PASSWORD', 'BEGIN PRIVATE KEY', 'secrets.env'):
                      if needle in text:
                          raise SystemExit(f'{path} mentions {needle}.')
          if not site:
              print('The privacy, terms, support and account deletion pages are not published: contact_email in web/site.json is empty.')
          print(f'Verified the synthetic demo artifact ({len(names)} files). No server or runtime data is included.')
          PY
      - name: Upload only the synthetic demo
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist-demo
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy synthetic demo
        id: deployment
        uses: actions/deploy-pages@v4
